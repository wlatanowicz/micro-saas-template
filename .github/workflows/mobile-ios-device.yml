name: Mobile iOS device

# Disabled. To enable: remove `if: false` on the job, enroll in the Apple
# Developer Program, register the test device, and add IOS_DISTRIBUTION_CERTIFICATE_BASE64,
# IOS_DISTRIBUTION_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, and IOS_TEAM_ID.
# The ad hoc profile App ID must match ios.bundleIdentifier, and the device UDID
# must be in that profile. This exports an ad hoc IPA, not a TestFlight build.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL baked into the IPA
        required: false
        type: string

permissions:
  contents: read

jobs:
  ios-device:
    if: false
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS workspace dependencies
        run: npm ci

      - name: Resolve API base URL
        env:
          INPUT_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          VAR_EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          VAR_API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
          VAR_FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_API_BASE_URL}" ]; then
            url="${INPUT_API_BASE_URL}"
          elif [ -n "${VAR_EXPO_PUBLIC_API_BASE_URL}" ]; then
            url="${VAR_EXPO_PUBLIC_API_BASE_URL}"
          elif [ -n "${VAR_API_DOMAIN_NAME}" ]; then
            url="https://${VAR_API_DOMAIN_NAME}"
          elif [ -n "${VAR_FRONTEND_DOMAIN_NAME}" ]; then
            url="https://api.${VAR_FRONTEND_DOMAIN_NAME}"
          else
            echo "Set EXPO_PUBLIC_API_BASE_URL, or API_DOMAIN_NAME, or FRONTEND_DOMAIN_NAME. A manual run can also pass api_base_url."
            exit 1
          fi
          echo "EXPO_PUBLIC_API_BASE_URL=${url}" >> "${GITHUB_ENV}"

      - name: Require signing secrets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Import distribution certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/profile.mobileprovision"
          profile_plist="${RUNNER_TEMP}/profile.plist"
          echo "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"
          echo "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${profile_path}"
          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "${profile_plist}")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist}")"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          echo "KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PASSWORD=${keychain_password}" >> "${GITHUB_ENV}"
          echo "PROFILE_NAME=${profile_name}" >> "${GITHUB_ENV}"

      - name: Prebuild iOS
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform ios --non-interactive

      - name: Archive for a physical device
        working-directory: mobile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 2 -name '*.xcworkspace' -print -quit)"
          scheme="$(basename "${workspace}" .xcworkspace)"
          bundle_id="$(node -e "process.stdout.write(require('./app.json').expo.ios.bundleIdentifier)")"
          archive_path="${RUNNER_TEMP}/app.xcarchive"
          export_plist="${RUNNER_TEMP}/ExportOptions.plist"
          BUNDLE_ID="${bundle_id}" EXPORT_PLIST="${export_plist}" python3 - <<'PY'
          import os
          import plistlib

          with open(os.environ["EXPORT_PLIST"], "wb") as handle:
              plistlib.dump(
                  {
                      "method": "ad-hoc",
                      "teamID": os.environ["IOS_TEAM_ID"],
                      "signingStyle": "manual",
                      "provisioningProfiles": {
                          os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
                      },
                  },
                  handle,
              )
          PY
          xcodebuild \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}" \
            archive
          xcodebuild -exportArchive \
            -archivePath "${archive_path}" \
            -exportPath "${RUNNER_TEMP}/ipa" \
            -exportOptionsPlist "${export_plist}"

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
